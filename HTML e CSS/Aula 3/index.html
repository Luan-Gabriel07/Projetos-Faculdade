<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta 
        name="viewport" 
        content="width=device-width, initial-scale=1.0"
    >
    <title> Página Inicial </title>
    <!-- "rel" serve para relacionar o documento HTML a 
     outro documento-->
    <link rel = "stylesheet" href="style.css">
</head>

<body>
    <h1>Meu site de tecnologia</h1>
    
    <!-- "img" serve para colocar imagem-->
    <!-- "src" colocar o link da imagem-->
    <!-- "alt" colocar uma legenda da imagem-->
    <img
        src="imagem_computador.jpg"
        alt="Computador utilizado para estudar programação"
        width=" 400"
    >

    <p>Estes site apresentanta informações sobre tecnologia e 
        desenvolvimento web
    </p>

    <p> 
        <!-- "href" especifica para utilizar URL-->
        <!-- "target" especifica onde abrir o link e permite 
        abrir em uma nova aba do navegador-->
        <!-- "a" serve para criar um texto ou uma imagem 
         onde voce pode clicar para ser levado a outro lugar -->
        <a
            href="https://www.google.com"
            target="_blank"
        >
            Acessar Google
        </a>
    </p>

    <p>
        <a href="sobre.html">
            Conheça mais sobre o site
        </a>
    </p>
</body>
</html>
